<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DraftMantra — Asta Fantacalcio Mantra 26/27</title>
<script src="js/papaparse.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ════════════════════ LEFT ════════════════════ -->
<div id="left">
  <div id="left-header">
    <h1>Draft<span class="mk">Mantra</span></h1>
    <label id="file-btn" for="file-input">📂 Carica lista giocatori</label>
    <input type="file" id="file-input" accept=".csv">
    <div id="file-status">Carica Lista-FantaAsta-Fantacalcio.csv</div>
    <div id="header-actions">
      <button id="export-btn">Esporta squadra CSV</button>
      <button id="reset-btn" title="Svuota la rosa e riparti da zero">↺ Reset asta</button>
    </div>
  </div>

  <div id="search-area">
    <input type="text" id="search-input" placeholder="🔍  Cerca giocatore..." autocomplete="off">
    <div id="search-results"></div>
  </div>

  <div id="budget-bar">
    <div id="budget-top">
      <div id="budget-main">
        <div class="bud-val" id="rem-val">500</div>
        <div class="bud-lbl">Rimasti</div>
      </div>
      <div id="budget-side">
        <label class="bud-mini" title="Budget totale (modificabile)">
          <span class="bud-lbl">Budget</span>
          <span class="bud-val"><input id="budget-input" type="number" value="500"></span>
        </label>
        <div class="bud-mini">
          <span class="bud-lbl">Spesi</span>
          <span class="bud-val" id="spent-val">0</span>
        </div>
        <div class="bud-mini" title="Giocatori di movimento">
          <span class="bud-lbl">Mov.</span>
          <span class="bud-val" id="mov-val">0</span>
        </div>
        <div class="bud-mini" title="Portieri">
          <span class="bud-lbl">Por</span>
          <span class="bud-val" id="gk-val">0</span>
        </div>
      </div>
    </div>
    <div id="budget-track"><div id="budget-fill"></div></div>
  </div>

  <div id="roster-list"></div>
  <div id="left-resizer" title="Trascina per allargare"></div>
</div>

<!-- ════════════════════ RIGHT ════════════════════ -->
<div id="right">
  <div id="controls">
    <span>MODULO:</span>
    <button class="fb" data-f="3-4-3">3-4-3</button>
    <button class="fb" data-f="3-4-1-2">3-4-1-2</button>
    <button class="fb" data-f="3-4-2-1">3-4-2-1</button>
    <button class="fb active" data-f="3-5-2">3-5-2</button>
    <button class="fb" data-f="3-5-1-1">3-5-1-1</button>
    <button class="fb" data-f="4-3-3">4-3-3</button>
    <button class="fb" data-f="4-3-1-2">4-3-1-2</button>
    <button class="fb" data-f="4-4-2">4-4-2</button>
    <button class="fb" data-f="4-1-4-1">4-1-4-1</button>
    <button class="fb" data-f="4-4-1-1">4-4-1-1</button>
    <button class="fb" data-f="4-2-3-1">4-2-3-1</button>
    <label id="pf-toggle" title="Se attivo, i polivalenti vengono tirati avanti per riempire slot offensivi vuoti. Se spento, ognuno resta nel ruolo più difensivo possibile.">
      <input type="checkbox" id="pf-check">
      <span class="pf-switch"></span>
      <span class="pf-text">Copri slot vuoti</span>
    </label>
  </div>
  <div id="pitch-wrap"><div id="pitch"></div></div>
  <div id="bench"><span id="bench-lbl">PANCHINA</span></div>
</div>

<!-- ════════════════════ MODAL ════════════════════ -->
<div id="modal">
  <div id="modal-box">
    <div id="modal-title"></div>
    <div id="modal-sub"></div>
    <div id="modal-stats"></div>
    <input id="price-input" type="number" min="1" max="999" placeholder="Prezzo pagato (FM)">
    <div class="mbts">
      <button id="btn-ok">✓ Aggiungi</button>
      <button id="btn-no">✕ Annulla</button>
    </div>
  </div>
</div>


<!-- Moduli JS: script classici, caricati in ordine di dipendenza.
     Niente ES modules così l'app funziona anche aprendo il file col doppio-click. -->
<script src="js/data.js"></script>
<script src="js/formations.js"></script>
<script src="js/assign.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
