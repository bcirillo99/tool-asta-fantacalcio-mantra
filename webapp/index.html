<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantacalcio Mantra 26/27</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
/* ── DESIGN TOKENS (OKLCH, neutri tinti verso il verde del campo) ── */
:root {
  --bg:          oklch(0.17 0.012 160);
  --surface:     oklch(0.215 0.014 160);
  --surface-2:   oklch(0.255 0.015 160);
  --surface-3:   oklch(0.30 0.015 160);
  --border:      oklch(0.32 0.014 160);
  --border-hi:   oklch(0.44 0.02 160);

  --text:        oklch(0.94 0.008 160);
  --text-dim:    oklch(0.72 0.012 160);
  --text-faint:  oklch(0.55 0.012 160);

  --accent:      oklch(0.66 0.15 250);   /* blu: interazione, selezione, focus */
  --accent-hi:   oklch(0.60 0.19 255);
  --gold:        oklch(0.80 0.14 82);    /* oro: crediti / valore */
  --pos:         oklch(0.76 0.15 158);   /* verde: rimasti / positivo */
  --neg:         oklch(0.66 0.20 25);    /* rosso: sforamento / elimina */

  --r-sm: 6px; --r: 9px; --r-lg: 13px;
  --shadow: 0 8px 24px oklch(0.12 0.02 160 / 0.5);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; height: 100vh; overflow: hidden;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}

/* ── LEFT PANEL ── */
#left { width: 340px; min-width: 300px; max-width: 70vw; background: var(--surface); display: flex; flex-direction: column; border-right: 1px solid var(--border); position: relative; flex-shrink: 0; }
#left-resizer { position: absolute; top: 0; right: -3px; width: 6px; height: 100%; cursor: col-resize; z-index: 30; }
#left-resizer::after { content: ""; position: absolute; inset: 0 2px; background: var(--accent); opacity: 0; transition: opacity 0.15s; }
#left-resizer:hover::after, #left-resizer.dragging::after { opacity: 0.5; }
body.resizing { cursor: col-resize; user-select: none; }

#left-header { padding: 14px 16px 12px; border-bottom: 1px solid var(--border); }
#left-header h1 { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 10px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 7px; }
#left-header h1::before { content: "⚽"; font-size: 16px; }
#file-input { width: 100%; font-size: 11px; color: var(--text-dim); cursor: pointer; }
#file-input::file-selector-button {
  margin-right: 8px; padding: 5px 11px; border-radius: var(--r-sm);
  border: 1px solid var(--border-hi); background: var(--surface-2);
  color: var(--text); font-size: 11px; font-weight: 600; cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
#file-input::file-selector-button:hover { background: var(--surface-3); border-color: var(--accent); }
#file-status { font-size: 10.5px; color: var(--text-faint); margin-top: 6px; }

#search-area { padding: 12px; border-bottom: 1px solid var(--border); position: relative; }
#search-input {
  width: 100%; padding: 9px 12px; border-radius: var(--r);
  border: 1px solid var(--border); background: var(--bg);
  color: var(--text); font-size: 13px; outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
#search-input::placeholder { color: var(--text-faint); }
#search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px oklch(0.66 0.15 250 / 0.18); }
#search-results {
  position: absolute; left: 12px; right: 12px; top: calc(100% - 2px);
  background: var(--surface-2); border: 1px solid var(--border-hi); border-radius: var(--r);
  max-height: 280px; overflow-y: auto; z-index: 50; display: none;
  box-shadow: var(--shadow);
}
#search-results.open { display: block; }
.sr-item {
  padding: 9px 12px; cursor: pointer; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  transition: background 0.12s;
}
.sr-item:last-child { border-bottom: none; }
.sr-item:hover { background: var(--surface-3); }
.sr-name { font-size: 12.5px; font-weight: 600; }
.sr-meta { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
.sr-qta { font-size: 13px; color: var(--gold); font-weight: 700; white-space: nowrap; }
.sr-new { font-size: 9px; font-weight: 700; background: oklch(0.66 0.15 250 / 0.18); color: var(--accent); padding: 1px 6px; border-radius: 10px; }
.sr-rig { font-size: 9px; font-weight: 700; background: oklch(0.80 0.14 82 / 0.16); color: var(--gold); padding: 1px 6px; border-radius: 10px; }

#budget-bar { background: var(--bg); padding: 13px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
#budget-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; }
#budget-main { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
#budget-main #rem-val { font-size: 30px; font-weight: 800; line-height: 1; color: var(--pos); letter-spacing: -0.02em; }
#budget-main .bud-lbl { font-size: 10px; }
#budget-side { display: flex; gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
.bud-mini { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.bud-mini .bud-val { font-size: 15px; font-weight: 700; }
.bud-lbl { font-size: 9px; font-weight: 600; letter-spacing: 0.06em; color: var(--text-faint); text-transform: uppercase; }
#spent-val { color: var(--text); }
#mov-val { color: var(--accent); }
#gk-val  { color: var(--gold); }
#budget-input {
  background: transparent; border: none; color: var(--text); font-size: 15px;
  font-weight: 700; width: 46px; text-align: right; padding: 0; outline: none;
  border-bottom: 1px dashed var(--border-hi); cursor: text;
}
#budget-input:focus { border-bottom-color: var(--accent); color: var(--accent); }
#budget-track { height: 5px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
#budget-fill { height: 100%; width: 0; border-radius: 3px; background: var(--pos); transition: width 0.35s cubic-bezier(0.22,1,0.36,1), background 0.2s; }
#budget-fill.over { background: var(--neg); }

#roster-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 5px; }
.rp {
  display: flex; align-items: center; gap: 8px; padding: 7px 9px;
  background: var(--surface-2); border-radius: var(--r);
  border: 1px solid transparent; transition: border-color 0.15s, background 0.15s;
}
.rp:hover { border-color: var(--border-hi); background: var(--surface-3); }
.rp-badge {
  font-size: 10px; font-weight: 800; padding: 3px 0; border-radius: var(--r-sm);
  min-width: 32px; text-align: center; letter-spacing: 0.02em;
}
.rp-info { flex: 1; min-width: 0; }
.rp-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rp-sub { font-size: 9.5px; color: var(--text-faint); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rp-price { font-size: 13px; font-weight: 700; color: var(--gold); white-space: nowrap; }
.rp-price::after { content: "\00a0FM"; font-size: 9px; font-weight: 600; color: var(--text-faint); }
#export-btn {
  margin-top: 10px; width: 100%; background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border-hi); border-radius: var(--r); padding: 9px; font-size: 12px;
  font-weight: 600; cursor: pointer; transition: background 0.15s, border-color 0.15s;
}
#export-btn:hover { background: var(--surface-3); border-color: var(--accent); }
.rp-role { flex-shrink: 0; background: var(--bg); color: var(--text-dim); border: 1px solid var(--border); border-radius: var(--r-sm); font-size: 10px; padding: 3px 4px; cursor: pointer; outline: none; }
.rp-role:hover { border-color: var(--accent); color: var(--text); }
.rp-del { color: var(--text-faint); cursor: pointer; font-size: 17px; padding: 0 3px; line-height: 1; flex-shrink: 0; transition: color 0.12s; }
.rp-del:hover { color: var(--neg); }
.rp-rig { font-size: 8px; font-weight: 700; color: var(--gold); }
.rp-new { font-size: 8px; font-weight: 700; color: var(--accent); }

/* ── RIGHT PANEL ── */
#right { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }

#controls { background: var(--surface); padding: 10px 14px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
#controls span { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-faint); margin-right: 4px; }
.fb {
  padding: 5px 13px; border-radius: 20px; border: 1px solid var(--border);
  background: transparent; color: var(--text-dim); cursor: pointer; font-size: 12px; font-weight: 500;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
}
.fb:hover { border-color: var(--border-hi); color: var(--text); }
.fb.active { background: var(--accent-hi); border-color: var(--accent-hi); color: oklch(0.98 0.01 250); font-weight: 600; }
#pf-toggle { margin-left: auto; display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 600; color: var(--text-dim); cursor: pointer; user-select: none; padding: 5px 12px 5px 8px; border-radius: 20px; border: 1px solid var(--border); transition: border-color 0.15s, background 0.15s, color 0.15s; }
#pf-toggle:hover { border-color: var(--border-hi); }
#pf-toggle input { position: absolute; opacity: 0; pointer-events: none; }
.pf-switch { position: relative; flex-shrink: 0; width: 38px; height: 22px; border-radius: 11px; background: var(--surface-3); border: 1px solid var(--border-hi); transition: background 0.2s; }
.pf-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--text-dim); transition: transform 0.2s cubic-bezier(0.22,1,0.36,1), background 0.2s; }
#pf-toggle:has(#pf-check:checked) { color: var(--text); background: oklch(0.66 0.15 250 / 0.14); border-color: var(--accent); }
#pf-check:checked + .pf-switch { background: var(--accent-hi); border-color: var(--accent-hi); }
#pf-check:checked + .pf-switch::after { transform: translateX(16px); background: oklch(0.98 0.01 250); }
#pf-check:focus-visible + .pf-switch { box-shadow: 0 0 0 3px oklch(0.66 0.15 250 / 0.3); }

#pitch-wrap { flex: 1; min-height: 0; min-width: 0; display: flex; align-items: center; justify-content: center; padding: 12px; background: var(--bg); }
#pitch {
  position: relative; border-radius: 10px; overflow: hidden;
  background: linear-gradient(180deg, #16a34a 0%, #15803d 100%);
  border: 3px solid #166534;
  box-shadow: 0 0 40px rgba(0,0,0,0.5);
}

/* pitch lines */
.pline { position: absolute; background: rgba(255,255,255,0.18); }
.pcircle { position: absolute; border: 2px solid rgba(255,255,255,0.18); border-radius: 50%; }

/* player slot */
.pslot { position: absolute; transform: translate(-50%,-50%); display: flex; flex-direction: column; align-items: center; z-index: 10; }
.pslot-role { font-size: 8px; color: rgba(255,255,255,0.5); margin-bottom: 1px; }
.pslot-circle {
  width: 48px; height: 48px; border-radius: 50%;
  border: 2px dashed rgba(255,255,255,0.3);
  background: rgba(0,0,0,0.25);
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; color: rgba(255,255,255,0.35);
  transition: all 0.2s;
}
.pslot.filled .pslot-circle {
  background: #1e3a5f; border: 2px solid #60a5fa; color: #fff;
  font-size: 9px; font-weight: 700; text-align: center; line-height: 1.2;
}
.pslot.filled.oop .pslot-circle { border-color: #f97316; background: #431407; }
.pslot.filled.rig1 .pslot-circle { border-color: #fcd34d; }
.pslot.filled.nuovo .pslot-circle { border-color: #818cf8; }
.pslot-name { font-size: 9px; color: #fff; font-weight: 600; text-shadow: 1px 1px 3px #000; margin-top: 2px; max-width: 58px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pslot-price { font-size: 8px; color: #fcd34d; }
.pslot-reserves { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-top: 3px; }
.pslot-res { font-size: 8px; color: #d1d5db; background: rgba(0,0,0,0.55); padding: 1px 6px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); white-space: nowrap; max-width: 66px; overflow: hidden; text-overflow: ellipsis; cursor: default; }

/* ── BENCH (senza slot) ── */
#bench { background: var(--surface); border-top: 1px solid var(--border); padding: 8px 14px; display: flex; align-items: center; gap: 7px; overflow-x: auto; min-height: 48px; flex-shrink: 0; }
#bench-lbl { font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-faint); white-space: nowrap; font-weight: 700; }
.bp {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm);
  padding: 4px 10px; font-size: 10.5px; white-space: nowrap; flex-shrink: 0;
}
.bp-role { color: var(--accent); font-weight: 700; margin-right: 5px; }
.bp-price { color: var(--gold); }
#bench.has-nofit #bench-lbl { color: var(--neg); }
.bench-count { display: inline-flex; align-items: center; justify-content: center; min-width: 16px; height: 16px; padding: 0 4px; margin-left: 3px; border-radius: 8px; background: var(--neg); color: oklch(0.98 0.01 25); font-size: 9px; font-weight: 800; }
.bp.nofit { background: oklch(0.66 0.20 25 / 0.14); border-color: oklch(0.66 0.20 25 / 0.45); }
.bp.nofit .bp-role { color: var(--neg); }

/* ── MODAL ── */
#modal { display: none; position: fixed; inset: 0; background: oklch(0.12 0.02 160 / 0.72); z-index: 100; align-items: center; justify-content: center; padding: 16px; }
#modal.open { display: flex; }
#modal-box { background: var(--surface); border-radius: var(--r-lg); padding: 22px; width: 320px; max-width: 100%; border: 1px solid var(--border-hi); box-shadow: 0 24px 64px oklch(0.10 0.02 160 / 0.6); }
#modal-title { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 2px; letter-spacing: -0.01em; }
#modal-sub { font-size: 11px; color: var(--text-dim); margin-bottom: 14px; }
#modal-stats { font-size: 11px; color: var(--text-dim); margin-bottom: 16px; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--r); line-height: 1.9; }
#modal-stats span { color: var(--text); font-weight: 600; }
#price-input {
  width: 100%; padding: 12px; font-size: 24px; text-align: center;
  border-radius: var(--r); border: 2px solid var(--border); background: var(--bg);
  color: var(--gold); font-weight: 800; margin-bottom: 12px; outline: none;
  transition: border-color 0.15s;
}
#price-input::placeholder { color: var(--text-faint); font-weight: 500; font-size: 15px; }
#price-input:focus { border-color: var(--accent); }
.mbts { display: flex; gap: 8px; }
.mbts button { flex: 1; padding: 11px; border-radius: var(--r); border: none; cursor: pointer; font-size: 14px; font-weight: 700; transition: background 0.15s; }
#btn-ok { background: var(--accent-hi); color: oklch(0.98 0.01 250); }
#btn-ok:hover { background: var(--accent); }
#btn-no { background: var(--surface-3); color: var(--text-dim); }
#btn-no:hover { background: var(--border-hi); color: var(--text); }

/* scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

/* ── RESPONSIVE (asta da telefono) ── */
@media (max-width: 820px) {
  body { flex-direction: column; height: auto; min-height: 100dvh; overflow-y: auto; }
  #left { width: 100% !important; min-width: 0; max-width: none; border-right: none; border-bottom: 1px solid var(--border); }
  #left-resizer { display: none; }
  #roster-list { max-height: 34vh; }
  #right { min-height: 84vh; }
  #controls { position: sticky; top: 0; z-index: 20; }
}
@media (max-width: 400px) {
  #budget-top { flex-direction: column; align-items: stretch; gap: 8px; }
  #budget-side { justify-content: space-between; }
}
</style>
</head>
<body>

<!-- ════════════════════ LEFT ════════════════════ -->
<div id="left">
  <div id="left-header">
    <h1>Fantacalcio Mantra 26/27</h1>
    <input type="file" id="file-input" accept=".csv">
    <div id="file-status">Carica Lista-FantaAsta-Fantacalcio.csv</div>
    <button id="export-btn">Esporta squadra CSV</button>
  </div>

  <div id="search-area">
    <input type="text" id="search-input" placeholder="🔍  Cerca giocatore..." autocomplete="off">
    <div id="search-results"></div>
  </div>

  <div id="budget-bar">
    <div id="budget-top">
      <div id="budget-main">
        <div class="bud-val" id="rem-val">500</div>
        <div class="bud-lbl">Rimasti</div>
      </div>
      <div id="budget-side">
        <label class="bud-mini" title="Budget totale (modificabile)">
          <span class="bud-lbl">Budget</span>
          <span class="bud-val"><input id="budget-input" type="number" value="500"></span>
        </label>
        <div class="bud-mini">
          <span class="bud-lbl">Spesi</span>
          <span class="bud-val" id="spent-val">0</span>
        </div>
        <div class="bud-mini" title="Giocatori di movimento">
          <span class="bud-lbl">Mov.</span>
          <span class="bud-val" id="mov-val">0</span>
        </div>
        <div class="bud-mini" title="Portieri">
          <span class="bud-lbl">Por</span>
          <span class="bud-val" id="gk-val">0</span>
        </div>
      </div>
    </div>
    <div id="budget-track"><div id="budget-fill"></div></div>
  </div>

  <div id="roster-list"></div>
  <div id="left-resizer" title="Trascina per allargare"></div>
</div>

<!-- ════════════════════ RIGHT ════════════════════ -->
<div id="right">
  <div id="controls">
    <span>MODULO:</span>
    <button class="fb" data-f="3-4-3">3-4-3</button>
    <button class="fb" data-f="3-4-1-2">3-4-1-2</button>
    <button class="fb" data-f="3-4-2-1">3-4-2-1</button>
    <button class="fb active" data-f="3-5-2">3-5-2</button>
    <button class="fb" data-f="3-5-1-1">3-5-1-1</button>
    <button class="fb" data-f="4-3-3">4-3-3</button>
    <button class="fb" data-f="4-3-1-2">4-3-1-2</button>
    <button class="fb" data-f="4-4-2">4-4-2</button>
    <button class="fb" data-f="4-1-4-1">4-1-4-1</button>
    <button class="fb" data-f="4-4-1-1">4-4-1-1</button>
    <button class="fb" data-f="4-2-3-1">4-2-3-1</button>
    <label id="pf-toggle" title="Se attivo, i polivalenti vengono tirati avanti per riempire slot offensivi vuoti. Se spento, ognuno resta nel ruolo più difensivo possibile.">
      <input type="checkbox" id="pf-check">
      <span class="pf-switch"></span>
      <span class="pf-text">Copri slot vuoti</span>
    </label>
  </div>
  <div id="pitch-wrap"><div id="pitch"></div></div>
  <div id="bench"><span id="bench-lbl">PANCHINA</span></div>
</div>

<!-- ════════════════════ MODAL ════════════════════ -->
<div id="modal">
  <div id="modal-box">
    <div id="modal-title"></div>
    <div id="modal-sub"></div>
    <div id="modal-stats"></div>
    <input id="price-input" type="number" min="1" max="999" placeholder="Prezzo pagato (FM)">
    <div class="mbts">
      <button id="btn-ok">✓ Aggiungi</button>
      <button id="btn-no">✕ Annulla</button>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════════
// DATA & STATE
// ════════════════════════════════════════════════════════════════
let players = [];
let squad   = [];   // [{player, price}]
let pending = null;
let formation = "3-5-2";
let budget  = 500;
let pullForward = false;   // true = riempi slot offensivi vuoti tirando avanti i polivalenti

const ROLE_ORDER = ["Por","Dc","B","Dd","Ds","E","M","C","W","T","A","Pc"];
const ri = r => ROLE_ORDER.indexOf(r);

// Colore per reparto (toni chiari, leggibili su sfondo scuro).
const ROLE_COLORS = {
  Por:"#fbbf24",                                   // portiere → arancione
  Dc:"#4ade80", B:"#4ade80", Dd:"#4ade80", Ds:"#4ade80", // difensori → verde
  E:"#60a5fa",  M:"#60a5fa", C:"#60a5fa",          // centrocampo → blu
  W:"#c084fc",  T:"#c084fc",                        // ali/trequarti → viola
  A:"#f87171",  Pc:"#f87171",                       // attaccanti → rosso
};
const roleColor = r => ROLE_COLORS[r] || "#9ca3af";

function roles(p) { return (p.RM||"").split(";").map(s=>s.trim()).filter(Boolean); }
function primaryRole(p) {
  return roles(p).sort((a,b) => ri(a)-ri(b))[0] || "?";
}

// ════════════════════════════════════════════════════════════════
// FORMATIONS — slots: {roles:[...], x%, y%}
// roles = lista ruoli accettati dallo slot (tutti primari, nessuna penalità)

// ════════════════════════════════════════════════════════════════
// ASSIGNMENT
// Titolari: match perfetto (score=0), più vincolato prima, QtA↓ tiebreaker.
// Riserve per slot: chi non è titolare ma copre quel ruolo, QtA↓.
// Chi non copre nessuno slot → "senza slot" in fondo.
// ════════════════════════════════════════════════════════════════
function qtaOf(sp) { return parseInt(sp.player.QtA) || 0; }

function assign(squadList, f) {
  const slots  = FORMS[f];
  const result = new Array(slots.length).fill(null);
  const used   = new Set();

  // Ruoli-slot presenti nel modulo (unione di tutti gli slot).
  const formRoles = new Set(slots.flatMap(s => s.roles));

  // targetRole: il ruolo PIÙ DIFENSIVO del giocatore che il modulo prevede come slot.
  // Es. B;Dd;E in un 3-difese (slot Dc,Dc,Dc/B): unico ruolo-slot coperto = B → target B.
  // Il giocatore competerà SOLO per gli slot che accettano il suo target, mai per uno
  // più offensivo. Così un secondo B;Dd;E finisce riserva di B, non titolare a E.
  // Ruoli effettivi: se l'utente ha forzato un ruolo (sp.forced), il giocatore è mono-ruolo.
  const spRoles = sp => sp.forced ? [sp.forced] : roles(sp.player);

  function targetRole(sp) {
    const pr = spRoles(sp).sort((a,b) => ri(a) - ri(b));
    for (const r of pr) if (formRoles.has(r)) return r;
    return null; // nessuno slot naturale nel modulo
  }
  function eligible(sp, slot) {
    const t = targetRole(sp);
    return t !== null && slot.roles.includes(t);
  }

  // Waste: quanti ruoli PIÙ DIFENSIVI del giocatore lo slot NON usa.
  // Un puro-ruolo (0 sprechi) batte un adattato. NON usa l'indice assoluto del ruolo:
  // in slot A/Pc un Pc (Lautaro) e un A (Berardi) sono entrambi naturali (waste 0),
  // quindi decide la QtA → titolare il più forte, non il "più difensivo".
  function waste(sp, slot) {
    const pr = spRoles(sp).sort((a,b) => ri(a) - ri(b));
    for (let i = 0; i < pr.length; i++) if (slot.roles.includes(pr[i])) return i;
    return 99;
  }

  // Candidati per uno slot (solo chi ha quel ruolo come target), ordinati:
  // waste ASC (meno sprechi = più adatto), poi QtA DESC (il più forte titolare).
  function candidates(si) {
    return squadList
      .filter(sp => !used.has(sp) && eligible(sp, slots[si]))
      .sort((a,b) => {
        const wa = waste(a, slots[si]);
        const wb = waste(b, slots[si]);
        if (wa !== wb) return wa - wb;
        return qtaOf(b) - qtaOf(a);
      });
  }

  // Most-constrained slot first.
  // Tie-break: slot più difensivo prima (min roleIndex tra i ruoli accettati).
  // Così Dc/B viene processato prima di E, anche con stesso numero di candidati.
  function order() {
    return slots.map((_,i)=>i)
      .filter(i => result[i] === null)
      .sort((a,b) => {
        const ca = squadList.filter(sp => !used.has(sp) && eligible(sp, slots[a])).length;
        const cb = squadList.filter(sp => !used.has(sp) && eligible(sp, slots[b])).length;
        if (ca !== cb) return ca - cb;
        // stesso numero di candidati → slot più difensivo prima
        const da = Math.min(...slots[a].roles.map(r => ri(r)));
        const db = Math.min(...slots[b].roles.map(r => ri(r)));
        return da - db;
      });
  }

  for (const si of order()) {
    const best = candidates(si)[0];
    if (best) { result[si] = best; used.add(best); }
  }

  // Pull-forward (opzionale): riempi gli slot rimasti vuoti tirando avanti i polivalenti,
  // spostando se serve anche i titolari (matching bipartito, algoritmo di Kuhn).
  // Es. 3-5-1-1 con Pulisic (T;A) titolare su T e Baturina (T) riserva: lo slot A/Pc è vuoto
  // → Pulisic va avanti su A, Baturina scala titolare su T. Un buco riempito, nessuno nuovo.
  // "natural" = il giocatore copre davvero quel ruolo (waste < 99), ignorando il target.
  const natural = (sp, slot) => waste(sp, slot) < 99;
  if (pullForward) {
    // candidati per uno slot: meno fuori-ruolo (waste) e QtA più alta prima
    const natCands = si => squadList
      .filter(sp => natural(sp, slots[si]))
      .sort((a,b) => {
        const wa = waste(a, slots[si]);
        const wb = waste(b, slots[si]);
        if (wa !== wb) return wa - wb;
        return qtaOf(b) - qtaOf(a);
      });
    const playerSlot = sp => result.findIndex(x => x === sp);
    function augment(si, seen) {
      for (const sp of natCands(si)) {
        if (seen.has(sp)) continue;
        seen.add(sp);
        const cur = playerSlot(sp);              // slot che occupa ora (-1 = libero)
        if (cur === -1 || augment(cur, seen)) {  // libero, o il suo slot si può riassegnare
          result[si] = sp;
          return true;
        }
      }
      return false;
    }
    slots.forEach((_, si) => { if (result[si] === null) augment(si, new Set()); });
    used.clear();
    result.forEach(sp => { if (sp) used.add(sp); });
  }

  // Riserve: ogni non-titolare va in UN SOLO slot — il migliore per lui
  // (waste minimo, poi slot più difensivo). Niente duplicati tra slot uguali/sovrapposti.
  const reserves = slots.map(() => []);
  squadList
    .filter(sp => !used.has(sp) && targetRole(sp) !== null)
    .forEach(sp => {
      let bi = -1, bw = 99, br = 99;
      slots.forEach((slot, i) => {
        if (!eligible(sp, slot)) return;
        const w  = waste(sp, slot);
        const rr = Math.min(...slot.roles.map(r => ri(r)));
        if (w < bw || (w === bw && rr < br)) { bw = w; br = rr; bi = i; }
      });
      if (bi >= 0) reserves[bi].push(sp);
    });
  reserves.forEach((list, i) =>
    list.sort((a,b) => {
      const wa = waste(a, slots[i]);
      const wb = waste(b, slots[i]);
      if (wa !== wb) return wa - wb;
      return qtaOf(b) - qtaOf(a);
    })
  );

  // Senza slot: chi non ha alcun ruolo-slot nel modulo
  const noSlot = squadList.filter(sp =>
    !used.has(sp) && targetRole(sp) === null
  );

  return { assigned: result, reserves, noSlot };
}

// PITCH RENDER
// ════════════════════════════════════════════════════════════════
function renderPitch() {
  const wrap  = document.getElementById("pitch-wrap");
  const pitch = document.getElementById("pitch");

  const cw = wrap.clientWidth  - 24;
  const ch = wrap.clientHeight - 24;
  // maintain 2:3 aspect (w:h)
  let pw, ph;
  if (cw * 1.5 <= ch) { pw = cw; ph = cw * 1.5; }
  else                 { ph = ch; pw = ch / 1.5; }
  pitch.style.width  = pw + "px";
  pitch.style.height = ph + "px";
  pitch.innerHTML    = "";

  // markings
  const mkLine = (top,left,w,h) => {
    const d = document.createElement("div");
    d.className = "pline";
    Object.assign(d.style,{top,left,width:w,height:h});
    pitch.appendChild(d);
  };
  mkLine("50%","5%","90%","2px");         // halfway
  mkLine("7%","20%","60%","2px");         // top box
  mkLine("80%","20%","60%","2px");        // bottom box
  mkLine("7%","20%","2px","14%");
  mkLine("7%","80%","2px","14%");
  mkLine("80%","20%","2px","14%");
  mkLine("80%","80%","2px","14%");

  const cc = document.createElement("div");
  cc.className = "pcircle";
  const cr = pw * 0.18;
  Object.assign(cc.style,{
    width:cr+"px",height:cr+"px",
    top:"50%",left:"50%",transform:"translate(-50%,-50%)"
  });
  pitch.appendChild(cc);

  const slots = FORMS[formation];
  const {assigned, reserves, noSlot} = assign(squad, formation);

  slots.forEach((slot, i) => {
    const sp  = assigned[i];
    const el  = document.createElement("div");
    el.className = "pslot" + (sp?" filled":"");
    if (sp) {
      if (sp.player.Rigorista==1)           el.classList.add("rig1");
      if (sp.player.Nuovo_Arrivo==="True")  el.classList.add("nuovo");
    }
    el.style.left = slot.x + "%";
    el.style.top  = slot.y + "%";

    const slotLabel = slot.roles.join("/");
    const col       = roleColor(slot.roles[0]);   // colore reparto dello slot

    const roleTag = document.createElement("div");
    roleTag.className = "pslot-role";
    roleTag.textContent = slotLabel;
    el.appendChild(roleTag);

    const circ = document.createElement("div");
    circ.className = "pslot-circle";
    if (sp) {
      const nm = sp.player.Nome.split(/[\s\-\.]/)[0];
      circ.textContent = nm.length > 7 ? nm.slice(0,6)+"." : nm;
      circ.style.color = col;
      // il bordo resta ai badge Rigorista/Nuovo se presenti, altrimenti colore ruolo
      if (!el.classList.contains("rig1") && !el.classList.contains("nuovo"))
        circ.style.borderColor = col;
    } else {
      circ.textContent = slotLabel;
      circ.style.color = col;
    }
    el.appendChild(circ);

    if (sp) {
      const nameEl = document.createElement("div");
      nameEl.className = "pslot-name";
      nameEl.textContent = sp.player.Nome.split(" ")[0];
      el.appendChild(nameEl);

      const prEl = document.createElement("div");
      prEl.className = "pslot-price";
      prEl.textContent = sp.price + " FM";
      el.appendChild(prEl);
    }

    // riserve per questo slot
    const res = reserves[i] || [];
    if (res.length > 0) {
      const resWrap = document.createElement("div");
      resWrap.className = "pslot-reserves";
      res.forEach(rsp => {
        const r = document.createElement("div");
        r.className = "pslot-res";
        r.textContent = rsp.player.Nome.split(" ")[0] + " " + rsp.price + "FM";
        r.title = rsp.player.Nome + " · " + rsp.player.RM + " · Qt.A " + rsp.player.QtA;
        resWrap.appendChild(r);
      });
      el.appendChild(resWrap);
    }

    pitch.appendChild(el);
  });

  // bench — solo chi non copre nessuno slot nel modulo
  const benchEl = document.getElementById("bench");
  const n = noSlot.length;
  benchEl.classList.toggle("has-nofit", n > 0);
  benchEl.innerHTML = `<span id='bench-lbl'>SENZA SLOT${n ? ` <span class="bench-count">${n}</span>` : ""}</span>`;
  if (n === 0) {
    const empty = document.createElement("span");
    empty.style.cssText = "font-size:11px;color:var(--text-faint)";
    empty.textContent = "— tutti schierabili";
    benchEl.appendChild(empty);
  }
  noSlot.forEach(sp => {
    const el = document.createElement("div");
    el.className = "bp nofit";
    el.innerHTML = `<span class="bp-role">${primaryRole(sp.player)}</span>${sp.player.Nome} <span class="bp-price">${sp.price}FM</span>`;
    benchEl.appendChild(el);
  });
}

// ════════════════════════════════════════════════════════════════
// ROSTER LIST
// ════════════════════════════════════════════════════════════════
function renderRoster() {
  const list = document.getElementById("roster-list");
  list.innerHTML = "";

  [...squad]
    .sort((a,b) => ri(primaryRole(a.player)) - ri(primaryRole(b.player)))
    .forEach(sp => {
      const p   = sp.player;
      const idx = squad.indexOf(sp);
      const el  = document.createElement("div");
      el.className = "rp";

      const rigBadge  = p.Rigorista > 0 ? `<span class="rp-rig">R${p.Rigorista}</span> ` : "";
      const newBadge  = p.Nuovo_Arrivo==="True" ? `<span class="rp-new">NEW</span> ` : "";
      const rl        = roles(p);
      const pr        = sp.forced || primaryRole(p);   // badge riflette il ruolo forzato
      const col       = roleColor(pr);

      // Dropdown ruolo solo per i multi-ruolo: Auto + ogni ruolo del giocatore.
      const roleSel = rl.length > 1 ? `
        <select class="rp-role" title="Schiera come (Auto = più difensivo)">
          <option value="">Auto</option>
          ${rl.map(r => `<option value="${r}" ${sp.forced===r?"selected":""}>${r}</option>`).join("")}
        </select>` : "";

      el.innerHTML = `
        <div class="rp-badge" style="color:${col};background:${col}22">${pr}</div>
        <div class="rp-info">
          <div class="rp-name">${rigBadge}${newBadge}${p.Nome}</div>
          <div class="rp-sub">${p.Squadra} · ${p.RM} · FVM ${p.FvmM || "—"}</div>
        </div>
        ${roleSel}
        <div class="rp-price">${sp.price}FM</div>
        <div class="rp-del" data-idx="${idx}">×</div>
      `;
      el.querySelector(".rp-del").addEventListener("click", e => {
        squad.splice(parseInt(e.target.dataset.idx), 1);
        save(); renderRoster(); renderPitch();
      });
      const sel = el.querySelector(".rp-role");
      if (sel) sel.addEventListener("change", e => {
        e.stopPropagation();
        sp.forced = e.target.value || null;
        save(); renderRoster(); renderPitch();
      });
      list.appendChild(el);
    });

  // budget
  const spent = squad.reduce((s,sp)=>s+sp.price,0);
  const rem   = budget - spent;
  const over  = rem < 0;
  document.getElementById("spent-val").textContent = spent;
  document.getElementById("rem-val").textContent   = rem;
  document.getElementById("rem-val").style.color   = over ? "var(--neg)" : "var(--pos)";
  const nGk  = squad.filter(sp => roles(sp.player).includes("Por")).length;
  document.getElementById("gk-val").textContent  = nGk;
  document.getElementById("mov-val").textContent = squad.length - nGk;

  const fill = document.getElementById("budget-fill");
  const pct  = budget > 0 ? Math.min(100, (spent / budget) * 100) : 0;
  fill.style.width = pct + "%";
  fill.classList.toggle("over", over);
}

// SEARCH
// ════════════════════════════════════════════════════════════════
const searchIn  = document.getElementById("search-input");
const searchRes = document.getElementById("search-results");

searchIn.addEventListener("input", () => {
  const q = searchIn.value.trim().toLowerCase();
  searchRes.className = "";
  searchRes.innerHTML = "";
  if (q.length < 2 || !players.length) return;

  const hits = players
    .filter(p => p.Nome && p.Nome.toLowerCase().includes(q))
    .slice(0, 14);

  if (!hits.length) return;
  searchRes.classList.add("open");

  hits.forEach(p => {
    const el  = document.createElement("div");
    el.className = "sr-item";
    const rig = p.Rigorista > 0 ? `<span class="sr-rig">R${p.Rigorista}</span>` : "";
    const nw  = p.Nuovo_Arrivo==="True" ? `<span class="sr-new">NEW</span>` : "";
    el.innerHTML = `
      <div>
        <div class="sr-name">${p.Nome} ${rig} ${nw}</div>
        <div class="sr-meta">${p.Squadra} · ${p.RM} · FVM ${p.FvmM || "—"}</div>
      </div>
      <div class="sr-qta">${p.QtaM || p.QtA} FM</div>
    `;
    el.addEventListener("click", () => { searchRes.classList.remove("open"); openModal(p); });
    searchRes.appendChild(el);
  });
});

document.addEventListener("click", e => {
  if (!e.target.closest("#search-area")) searchRes.classList.remove("open");
});

// MODAL
// ════════════════════════════════════════════════════════════════
function openModal(p) {
  pending = p;
  searchIn.value = "";
  document.getElementById("modal-title").textContent = p.Nome;
  document.getElementById("modal-sub").textContent   = `${p.Squadra} · ${p.RM}`;

  const qtaM = p.QtaM || p.QtA;

  document.getElementById("modal-stats").innerHTML = `
    Qt.A: <span>${qtaM} FM</span>  ·  Qt.I: <span>${p.QtiM || "—"}</span><br>
    FVM: <span>${p.FvmM || "—"}</span>  ·  Ruolo: <span>${p.RM}</span>
  `;

  const pi = document.getElementById("price-input");
  pi.value = qtaM || "";
  document.getElementById("modal").classList.add("open");
  pi.focus(); pi.select();
}

function confirmAdd() {
  const price = parseInt(document.getElementById("price-input").value);
  if (!pending || !price || price < 1) return;
  squad.push({ player: pending, price });
  document.getElementById("modal").classList.remove("open");
  pending = null;
  save(); renderRoster(); renderPitch();
}

document.getElementById("btn-ok").addEventListener("click", confirmAdd);
document.getElementById("btn-no").addEventListener("click", () => {
  document.getElementById("modal").classList.remove("open");
});
document.getElementById("price-input").addEventListener("keydown", e => {
  if (e.key === "Enter")  confirmAdd();
  if (e.key === "Escape") document.getElementById("modal").classList.remove("open");
});

// ════════════════════════════════════════════════════════════════
// FILE LOAD
// ════════════════════════════════════════════════════════════════
// Lista-FantaAsta-Fantacalcio.csv: NESSUN header, colonne per indice:
// 0 Id · 1 Nome · 2 NomeCompleto · 3 R · 4 RM · 5 QtI · 6 QtA · 7 QtI_M · 8 QtA_M
// 9 Squadra · 10 FVM · 11 FVM_M · 12 piede · 13 nazione · 14 nascita · 15 img · ...
function fromLista(rows) {
  return rows
    .filter(r => r.length >= 10 && r[1] && r[4])
    .map(r => ({
      Nome: (r[1]||"").trim(),
      R:    (r[3]||"").trim(),
      RM:   (r[4]||"").trim(),
      Squadra: (r[9]||"").trim(),
      QtA:  parseInt(r[8]) || parseInt(r[6]) || 1,   // Mantra attuale, fallback classic
      FVM:  parseInt(r[11]) || parseInt(r[10]) || 0, // FVM Mantra, fallback classic
      QtaM: parseInt(r[8]) || 0, QtiM: parseInt(r[7]) || 0, FvmM: parseInt(r[11]) || 0,
      Rigorista: 0, Nuovo_Arrivo: "False", Fm_2526: ""
    }));
}
// riassuntivo_asta_2627.csv: header con Nome/RM/QtA/... → mappatura per intestazione
function fromHeader(rows) {
  const head = rows[0].map(h => (h||"").trim());
  const idx  = {}; head.forEach((h,i) => idx[h] = i);
  const get  = (r,k) => idx[k] != null ? r[idx[k]] : "";
  return rows.slice(1)
    .filter(r => (get(r,"Nome")||"").trim())
    .map(r => ({
      Nome: get(r,"Nome"), R: get(r,"R"), RM: get(r,"RM"), Squadra: get(r,"Squadra"),
      QtA: parseInt(get(r,"QtA")) || 1, FVM: parseInt(get(r,"FVM")) || 0,
      QtaM: parseInt(get(r,"QtA_M")) || 0, QtiM: parseInt(get(r,"QtI_M")) || 0, FvmM: parseInt(get(r,"FVM_M")) || 0,
      Rigorista: parseInt(get(r,"Rigorista")) || 0,
      Nuovo_Arrivo: get(r,"Nuovo_Arrivo"),
      Fm_2526: get(r,"Fm_2526"),
      Pv_2526: get(r,"Pv_2526"), Gf_2526: get(r,"Gf_2526"),
      Ass_2526: get(r,"Ass_2526"), Amm_2526: get(r,"Amm_2526")
    }));
}

document.getElementById("file-input").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  Papa.parse(file, {
    header: false, skipEmptyLines: true,
    complete: r => {
      const rows = r.data;
      const first = (rows[0] || []).map(c => (c||"").trim());
      const hasHeader = first.includes("Nome") && first.includes("RM");
      players = hasHeader ? fromHeader(rows) : fromLista(rows);
      const fs = document.getElementById("file-status");
      if (players.length) {
        fs.textContent = `✓ ${players.length} giocatori caricati` +
                         (hasHeader ? "" : " (Lista Asta)");
        fs.style.color = "var(--pos)";
      } else {
        fs.textContent = "⚠ Nessun giocatore riconosciuto nel file";
        fs.style.color = "var(--neg)";
      }
    },
    error: () => {
      document.getElementById("file-status").textContent = "⚠ Errore nel file";
      document.getElementById("file-status").style.color = "var(--neg)";
    }
  });
});

// ════════════════════════════════════════════════════════════════
// FORMATION BUTTONS
// ════════════════════════════════════════════════════════════════
document.querySelectorAll(".fb").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".fb").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    formation = btn.dataset.f;
    save(); renderPitch();
  });
});

document.getElementById("budget-input").addEventListener("change", e => {
  budget = parseInt(e.target.value) || 250;
  save(); renderRoster();
});

document.getElementById("pf-check").addEventListener("change", e => {
  pullForward = e.target.checked;
  save(); renderPitch();
});

// ════════════════════════════════════════════════════════════════
// EXPORT CSV
// ════════════════════════════════════════════════════════════════
function exportCSV() {
  if (!squad.length) { alert("Rosa vuota: niente da esportare."); return; }
  const esc = v => {
    const s = String(v ?? "");
    return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const header = ["Nome","Squadra","RM","Ruolo_Scelto","Prezzo_FM","QtA"];
  const rows = [...squad]
    .sort((a,b) => ri(primaryRole(a.player)) - ri(primaryRole(b.player)))
    .map(sp => [
      sp.player.Nome, sp.player.Squadra, sp.player.RM,
      sp.forced || "Auto", sp.price, sp.player.QtA
    ].map(esc).join(","));
  const csv  = [header.join(","), ...rows].join("\n");
  const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href = url;
  a.download = `squad_${formation}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}
document.getElementById("export-btn").addEventListener("click", exportCSV);

// ════════════════════════════════════════════════════════════════
// PERSIST
// ════════════════════════════════════════════════════════════════
function save() {
  localStorage.setItem("fc_squad",     JSON.stringify(squad));
  localStorage.setItem("fc_formation", formation);
  localStorage.setItem("fc_budget",    budget);
  localStorage.setItem("fc_pullfwd",   pullForward ? "1" : "0");
}

function load() {
  try { squad = JSON.parse(localStorage.getItem("fc_squad")) || []; } catch(e) { squad=[]; }
  const f = localStorage.getItem("fc_formation");
  if (f && FORMS[f]) {
    formation = f;
    document.querySelectorAll(".fb").forEach(b => b.classList.toggle("active", b.dataset.f===f));
  }
  const b = localStorage.getItem("fc_budget");
  if (b) { budget = parseInt(b); document.getElementById("budget-input").value = budget; }
  pullForward = localStorage.getItem("fc_pullfwd") === "1";
  document.getElementById("pf-check").checked = pullForward;
  const w = parseInt(localStorage.getItem("fc_leftwidth"));
  if (w && window.innerWidth > 820) document.getElementById("left").style.width = w + "px";
}

window.addEventListener("resize", renderPitch);

// ── Ridimensiona pannello sinistro (trascina il bordo) ──
(function() {
  const left = document.getElementById("left");
  const rez  = document.getElementById("left-resizer");
  let dragging = false;
  const clamp = x => Math.max(300, Math.min(window.innerWidth * 0.7, x));

  rez.addEventListener("mousedown", e => {
    dragging = true; rez.classList.add("dragging");
    document.body.classList.add("resizing");
    e.preventDefault();
  });
  window.addEventListener("mousemove", e => {
    if (!dragging) return;
    left.style.width = clamp(e.clientX - left.getBoundingClientRect().left) + "px";
    renderPitch();
  });
  window.addEventListener("mouseup", () => {
    if (!dragging) return;
    dragging = false; rez.classList.remove("dragging");
    document.body.classList.remove("resizing");
    localStorage.setItem("fc_leftwidth", parseInt(left.style.width));
  });
})();

load(); renderRoster(); renderPitch();
</script>
